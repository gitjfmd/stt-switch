name: pr-stamp

# PR provenance stamp gate (CEO 2026-11-15/16: "I want that footprint in all the
# PRs ... across every repo and every cli"). An agent-created PR whose body lacks
# the stamp fields (cli, session id, session name, date, branch, parallel
# agents) CANNOT MERGE: the job below is a REQUIRED status check on `dev`.
#
# RULE (same as scripts/check-pr-stamp.sh): PASS iff the body carries the stamp
# in the CEO's canonical field set (cli:, session-id:, session-name:, datetime:,
# message:, branch:, agents:) OR declares exactly `human PR, no stamp` on its
# own line. Bot actors (<name>[bot]: renovate, github-actions, ...) are exempt
# HERE because a bot body has no agent session to stamp.
#
# The stamp is generated by scripts/agent-commit-identity.sh; emit the current
# session's block with: bash scripts/check-pr-stamp.sh --print

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pr-stamp:
    name: agent provenance stamp present
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: check the PR body carries the provenance stamp
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_ACTOR: ${{ github.actor }}
        run: |
          case "$PR_ACTOR" in
            *'[bot]') echo "bot actor $PR_ACTOR — exempt"; exit 0 ;;
          esac
          body="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body"
          bash scripts/check-pr-stamp.sh "$body"
